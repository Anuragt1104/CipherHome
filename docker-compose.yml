version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://cipherhome:password@postgres:5432/cipherhome
      - MINIO_ENDPOINT=minio
      - OLLAMA_URL=http://ollama:11434
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - JELLYFIN_URL=http://jellyfin:8096
    depends_on:
      - postgres
      - minio
      - ollama
      - jellyfin
    restart: unless-stopped
    networks:
      - cipherhome-network

  # Frontend Dashboard
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cipherhome-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=cipherhome
      - POSTGRES_USER=cipherhome
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - cipherhome-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - cipherhome-network

  # Ollama (Local LLM)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - cipherhome-network
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Jellyfin Media Server
  jellyfin:
    image: jellyfin/jellyfin:latest
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - media-data:/media
    restart: unless-stopped
    networks:
      - cipherhome-network

  # Traefik Reverse Proxy (Optional - for HTTPS)
  # traefik:
  #   image: traefik:v2.10
  #   command:
  #     - --api.insecure=true
  #     - --providers.docker=true
  #     - --entrypoints.web.address=:80
  #     - --entrypoints.websecure.address=:443
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   restart: unless-stopped
  #   networks:
  #     - cipherhome-network

networks:
  cipherhome-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  ollama-data:
  jellyfin-config:
  jellyfin-cache:
  media-data:
